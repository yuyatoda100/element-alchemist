<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エレメントアルケミスト - Element Alchemist</title>
    <!-- Pixi.js v7 for WebGL rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0905;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #d8c29d;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 羊皮紙風 UI パネル */
        .parchment-panel {
            background: rgba(22, 16, 11, 0.88);
            border: 2px solid #8c6a43;
            border-radius: 6px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 8px 20px rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
        }

        /* 画面上部 資源・ステータスバー */
        #top-resource-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 16px;
            z-index: 10;
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .resource-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #fff;
            text-shadow: 0 0 2px #000;
        }

        /* 画面右上 目標パネル */
        #objective-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 260px;
            padding: 12px;
            z-index: 10;
        }

        .panel-title {
            font-size: 14px;
            font-weight: bold;
            color: #f1c40f;
            border-bottom: 1px solid #6b4d2b;
            padding-bottom: 4px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .task-list {
            font-size: 12px;
            line-height: 1.6;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            color: #bfa888;
        }
        .task-item.done {
            color: #2ecc71;
        }

        /* 画面左下 構築ホットバー & ツール */
        #controls-panel {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hotbar {
            display: flex;
            gap: 6px;
            padding: 6px;
        }

        .hotbar-btn {
            width: 48px;
            height: 48px;
            background: rgba(35, 25, 17, 0.9);
            border: 1px solid #7c5c37;
            border-radius: 4px;
            color: #d8c29d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hotbar-btn:hover {
            border-color: #f1c40f;
            transform: translateY(-2px);
        }
        .hotbar-btn.active {
            border: 2px solid #f1c40f;
            background: rgba(107, 77, 43, 0.6);
            color: #fff;
        }

        .hotbar-key {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 9px;
            color: #8c6a43;
        }

        /* プレイヤー操作の操作ガイド */
        #guide-overlay {
            position: absolute;
            bottom: 12px;
            right: 12px;
            padding: 10px 14px;
            font-size: 12px;
            z-index: 10;
            line-height: 1.5;
        }

        /* 勝利オーバーレイ */
        #victory-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 480px;
            padding: 24px;
            text-align: center;
            z-index: 100;
            display: none;
            background: rgba(15, 10, 5, 0.95);
            border: 3px solid #f1c40f;
            box-shadow: 0 0 40px rgba(241, 196, 15, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 資源インベントリバー -->
        <div id="top-resource-bar" class="parchment-panel">
            <div class="resource-item">
                <div class="resource-icon" style="background:#e74c3c;">🜂</div>
                <span>火: <span id="res-fire">0</span></span>
            </div>
            <div class="resource-item">
                <div class="resource-icon" style="background:#3498db;">🜄</div>
                <span>水: <span id="res-water">0</span></span>
            </div>
            <div class="resource-item">
                <div class="resource-icon" style="background:#795548;">🜃</div>
                <span>土: <span id="res-earth">0</span></span>
            </div>
            <div class="resource-item">
                <div class="resource-icon" style="background:#f1c40f;">🜁</div>
                <span>風: <span id="res-wind">0</span></span>
            </div>
            <div style="margin-left: 20px; border-left: 1px solid #555; padding-left: 15px; font-size: 12px;">
                美観度: <span id="score-val" style="color:#f1c40f; font-weight:bold;">0</span>pt
            </div>
        </div>

        <!-- 目標パネル -->
        <div id="objective-panel" class="parchment-panel">
            <div class="panel-title">
                <span>錬金術の試練</span>
                <span id="rank-val" style="background:#f1c40f; color:#000; padding:0 6px; border-radius:3px; font-size:11px;">Rank D</span>
            </div>
            <div class="task-list">
                <div id="task-1" class="task-item"><span>・川/火山に採取陣を配置</span><span>未判定</span></div>
                <div id="task-2" class="task-item"><span>・導管で中央へエレメント運搬</span><span>未判定</span></div>
                <div id="task-3" class="task-item"><span>・調合陣で蒸気/溶岩を作成</span><span>未判定</span></div>
                <div id="task-4" class="task-item"><span>・賢者の石を錬成する</span><span>0/1</span></div>
            </div>
        </div>

        <!-- コントロールホットバー -->
        <div id="controls-panel">
            <div class="hotbar parchment-panel">
                <button id="btn-move" class="hotbar-btn active" onclick="setMode('move')">
                    <span style="font-size:16px;">🚶</span>
                    <span>移動</span>
                </button>
                <button id="btn-extractor" class="hotbar-btn" onclick="setMode('extractor')">
                    <span style="font-size:16px;">⛏️</span>
                    <span>採取陣</span>
                </button>
                <button id="btn-relay" class="hotbar-btn" onclick="setMode('relay')">
                    <span style="font-size:16px;">◇</span>
                    <span>中継陣</span>
                </button>
                <button id="btn-mixer" class="hotbar-btn" onclick="setMode('mixer')">
                    <span style="font-size:16px;">△</span>
                    <span>調合陣</span>
                </button>
                <button id="btn-connect" class="hotbar-btn" onclick="setMode('connect')">
                    <span style="font-size:16px;">⚡</span>
                    <span>導管(C)</span>
                </button>
                <button id="btn-delete" class="hotbar-btn" onclick="setMode('delete')">
                    <span style="font-size:16px;">🗑️</span>
                    <span>撤去(R)</span>
                </button>
            </div>
        </div>

        <!-- 操作用ガイド -->
        <div id="guide-overlay" class="parchment-panel">
            <div><strong>【操作方法】</strong></div>
            <div>移動: <strong>WASD</strong> キー</div>
            <div>ズーム: <strong>マウスホイール</strong></div>
            <div>アクション: 自然地形に近寄り、採取陣・導管を設置</div>
        </div>

        <!-- クリアダイアログ -->
        <div id="victory-modal" class="parchment-panel">
            <h2 style="color:#f1c40f; margin-bottom:10px;">Solve et Coagula</h2>
            <p style="font-size:14px; line-height:1.6; margin-bottom:15px;">
                見事に賢者の石の調合に成功しました！<br>
                星の霊脈が共鳴し、完璧な真理の魔法陣が完成しました。
            </p>
            <button onclick="document.getElementById('victory-modal').style.display='none'" style="padding:8px 20px; background:#f1c40f; border:none; color:#000; font-weight:bold; cursor:pointer; border-radius:4px;">
                自由構築（サンドボックス）を続ける
            </button>
        </div>
    </div>

    <script>
        // --- データ構造 ---
        const ELEMENTS = {
            1: { id: 1, name: "火", symbol: "🜂", color: 0xe74c3c, bgHex: "#e74c3c" },
            2: { id: 2, name: "水", symbol: "🜄", color: 0x3498db, bgHex: "#3498db" },
            3: { id: 3, name: "土", symbol: "🜃", color: 0x795548, bgHex: "#795548" },
            4: { id: 4, name: "風", symbol: "🜁", color: 0xf1c40f, bgHex: "#f1c40f" },
            5: { id: 5, name: "蒸気", symbol: "♨", color: 0xecf0f1, bgHex: "#ecf0f1" },
            6: { id: 6, name: "溶岩", symbol: "🌋", color: 0xd35400, bgHex: "#d35400" },
            31: { id: 31, name: "賢者の石", symbol: "☸", color: 0xff0055, bgHex: "#ff0055" }
        };

        const RECIPES = [
            { in: [1, 2], out: 5 }, // 火 + 水 -> 蒸気
            { in: [1, 3], out: 6 }, // 火 + 土 -> 溶岩
            { in: [5, 6], out: 31 } // 蒸気 + 溶岩 -> 賢者の石 (プロトタイプ簡略化版)
        ];

        // 地形リソース
        const TERRAIN_TYPES = {
            RIVER: { name: "水脈・川", elementId: 2, color: 0x2980b9 },
            VOLCANO: { name: "火山・溶岩", elementId: 1, color: 0xc0392b },
            MOUNTAIN: { name: "山脈・土壌", elementId: 3, color: 0x5d4037 },
            WIND_VALLEY: { name: "風の谷", elementId: 4, color: 0xd4ac0d }
        };

        // --- アプリケーション状態 ---
        let app, worldContainer;
        let terrainGraphics, bgAlchemyGraphics, lineGraphics, particleGraphics, nodeContainer, playerGraphics;
        
        let player = { x: 0, y: 0, radius: 18, speed: 4, reachRadius: 180 };
        let keys = { w: false, a: false, s: false, d: false };
        let currentMode = 'move'; // 'move', 'extractor', 'relay', 'mixer', 'connect', 'delete'
        
        let terrainZones = [];
        let nodes = [];
        let lines = [];
        let particles = [];
        let inventory = { 1: 0, 2: 0, 3: 0, 4: 0 };

        let connectingStartNode = null;
        let gameCleared = false;

        window.onload = function() {
            const container = document.getElementById('game-container');
            app = new PIXI.Application({
                width: container.clientWidth,
                height: container.clientHeight,
                backgroundColor: 0x0d0905,
                resolution: window.devicePixelRatio || 1,
                autoDensity: true,
                antialias: true
            });
            container.appendChild(app.view);

            worldContainer = new PIXI.Container();
            app.stage.addChild(worldContainer);

            // 各種描画レイヤー
            bgAlchemyGraphics = new PIXI.Graphics();
            terrainGraphics = new PIXI.Graphics();
            lineGraphics = new PIXI.Graphics();
            particleGraphics = new PIXI.Graphics();
            nodeContainer = new PIXI.Container();
            playerGraphics = new PIXI.Graphics();

            worldContainer.addChild(bgAlchemyGraphics);
            worldContainer.addChild(terrainGraphics);
            worldContainer.addChild(lineGraphics);
            worldContainer.addChild(particleGraphics);
            worldContainer.addChild(nodeContainer);
            worldContainer.addChild(playerGraphics);

            generateTerrain();
            setupInitialNodes();
            setupEvents();

            app.ticker.add((delta) => {
                updatePlayer(delta);
                updateGameLogic(delta);
                renderScene();
            });
        };

        // --- 地形＆初期配置の生成 ---
        function generateTerrain() {
            // 川・水脈
            terrainZones.push({ type: TERRAIN_TYPES.RIVER, x: -400, y: -200, radius: 110 });
            terrainZones.push({ type: TERRAIN_TYPES.RIVER, x: -500, y: -100, radius: 90 });
            // 火山
            terrainZones.push({ type: TERRAIN_TYPES.VOLCANO, x: 450, y: -250, radius: 120 });
            // 山脈
            terrainZones.push({ type: TERRAIN_TYPES.MOUNTAIN, x: -350, y: 350, radius: 130 });
            // 風の谷
            terrainZones.push({ type: TERRAIN_TYPES.WIND_VALLEY, x: 400, y: 300, radius: 100 });
        }

        function setupInitialNodes() {
            // 中央の大錬成陣（最終合成ハブ）
            createNode(0, 0, 'mixer', null);
        }

        function createNode(x, y, type, elementId = null) {
            const node = {
                id: Date.now() + Math.random(),
                x: x,
                y: y,
                type: type, // 'extractor', 'relay', 'mixer'
                elementId: elementId,
                inputs: {},
                gfx: new PIXI.Graphics(),
                textGfx: new PIXI.Text('', { fontSize: 16, fill: 0xffffff })
            };

            node.gfx.interactive = true;
            node.gfx.buttonMode = true;
            node.gfx.on('pointerdown', (e) => onNodeClick(e, node));

            nodeContainer.addChild(node.gfx);
            nodeContainer.addChild(node.textGfx);
            nodes.push(node);
            return node;
        }

        // --- プレイヤー移動とカメラ追従 ---
        function updatePlayer(delta) {
            let dx = 0, dy = 0;
            if (keys.w) dy -= 1;
            if (keys.s) dy += 1;
            if (keys.a) dx -= 1;
            if (keys.d) dx += 1;

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            player.x += dx * player.speed * delta;
            player.y += dy * player.speed * delta;

            // カメラを中心追従
            worldContainer.x = app.screen.width / 2 - player.x;
            worldContainer.y = app.screen.height / 2 - player.y;
        }

        // --- ゲーム進行・流体ロジック ---
        function updateGameLogic(delta) {
            // 採取陣からの自動生産
            nodes.forEach(node => {
                if (node.type === 'extractor' && node.elementId) {
                    if (Math.random() < 0.03) {
                        inventory[node.elementId] = (inventory[node.elementId] || 0) + 1;
                        updateUI();

                        // 導管へ送出
                        lines.filter(l => l.from === node).forEach(line => {
                            particles.push({
                                line: line,
                                progress: 0,
                                speed: 0.015,
                                elementId: node.elementId
                            });
                        });
                    }
                }
            });

            // パーティクルの導管移動
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.progress += p.speed * delta;
                if (p.progress >= 1.0) {
                    const target = p.line.to;
                    if (target.type === 'mixer') {
                        target.inputs[p.elementId] = (target.inputs[p.elementId] || 0) + 1;
                        checkMixerRecipes(target);
                    } else if (target.type === 'relay') {
                        target.elementId = p.elementId;
                        // 次の導管へリレー
                        lines.filter(l => l.from === target).forEach(line => {
                            particles.push({ line: line, progress: 0, speed: 0.015, elementId: p.elementId });
                        });
                    }
                    particles.splice(i, 1);
                }
            }
        }

        function checkMixerRecipes(mixerNode) {
            for (let recipe of RECIPES) {
                const canCraft = recipe.in.every(req => (mixerNode.inputs[req] || 0) > 0);
                if (canCraft) {
                    recipe.in.forEach(req => mixerNode.inputs[req]--);
                    mixerNode.elementId = recipe.out;

                    if (recipe.out === 31 && !gameCleared) {
                        gameCleared = true;
                        document.getElementById('victory-modal').style.display = 'block';
                        document.getElementById('task-4').classList.add('done');
                        document.getElementById('task-4').innerHTML = '<span>・賢者の石を錬成する</span><span>達成！</span>';
                    }
                    break;
                }
            }
        }

        // --- 描画処理 ---
        function renderScene() {
            // 1. 古代羊皮紙風 錬金術幾何学背景
            bgAlchemyGraphics.clear();
            bgAlchemyGraphics.lineStyle(1.5, 0x5a4325, 0.25);
            bgAlchemyGraphics.drawCircle(0, 0, 150);
            bgAlchemyGraphics.drawCircle(0, 0, 300);
            bgAlchemyGraphics.drawCircle(0, 0, 600);
            
            // 放射状直線
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
                bgAlchemyGraphics.moveTo(0, 0);
                bgAlchemyGraphics.lineTo(Math.cos(a) * 700, Math.sin(a) * 700);
            }

            // 2. 自然地形の描画
            terrainGraphics.clear();
            terrainZones.forEach(zone => {
                terrainGraphics.beginFill(zone.type.color, 0.35);
                terrainGraphics.lineStyle(2, zone.type.color, 0.8);
                terrainGraphics.drawCircle(zone.x, zone.y, zone.radius);
                terrainGraphics.endFill();
            });

            // 3. 導管（ライン）
            lineGraphics.clear();
            lines.forEach(line => {
                lineGraphics.lineStyle(gameCleared ? 4 : 2, gameCleared ? 0xf1c40f : 0x8c6a43, 0.8);
                lineGraphics.moveTo(line.from.x, line.from.y);
                lineGraphics.lineTo(line.to.x, line.to.y);
            });

            // 4. エレメント粒子
            particleGraphics.clear();
            particles.forEach(p => {
                const elem = ELEMENTS[p.elementId];
                const color = elem ? elem.color : 0xffffff;
                const x = p.line.from.x + (p.line.to.x - p.line.from.x) * p.progress;
                const y = p.line.from.y + (p.line.to.y - p.line.from.y) * p.progress;
                
                particleGraphics.beginFill(color, 0.9);
                particleGraphics.drawCircle(x, y, 5);
                particleGraphics.endFill();
            });

            // 5. ノード描画 & アイコン表示
            nodes.forEach(node => {
                const g = node.gfx;
                g.clear();

                const elem = ELEMENTS[node.elementId];
                const color = elem ? elem.color : 0x4a3525;

                if (node.type === 'extractor') {
                    g.beginFill(color, 0.9);
                    g.lineStyle(2, 0xffffff, 0.8);
                    g.drawRect(node.x - 14, node.y - 14, 28, 28);
                    g.endFill();

                    if (elem) {
                        node.textGfx.text = elem.symbol;
                        node.textGfx.x = node.x - 7;
                        node.textGfx.y = node.y - 32;
                    }
                } else if (node.type === 'mixer') {
                    g.beginFill(color, 0.9);
                    g.lineStyle(3, 0xf1c40f, 1.0);
                    g.drawPolygon([
                        node.x, node.y - 22,
                        node.x + 20, node.y + 14,
                        node.x - 20, node.y + 14
                    ]);
                    g.endFill();
                } else { // relay
                    g.beginFill(0x2c1d11, 0.9);
                    g.lineStyle(2, 0x8c6a43, 0.8);
                    g.drawCircle(node.x, node.y, 10);
                    g.endFill();
                }
            });

            // 6. プレイヤー & リーチエリア
            playerGraphics.clear();
            // リーチ範囲 (点線円枠)
            playerGraphics.lineStyle(1, 0xf1c40f, 0.3);
            playerGraphics.drawCircle(player.x, player.y, player.reachRadius);

            // プレイヤー本体 (錬金術師)
            playerGraphics.beginFill(0xd35400, 0.9);
            playerGraphics.lineStyle(2, 0xffffff, 1.0);
            playerGraphics.drawCircle(player.x, player.y, player.radius);
            playerGraphics.endFill();
        }

        // --- インタラクション & 構築 ---
        function setupEvents() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'w' || e.key === 'W') keys.w = true;
                if (e.key === 's' || e.key === 'S') keys.s = true;
                if (e.key === 'a' || e.key === 'A') keys.a = true;
                if (e.key === 'd' || e.key === 'D') keys.d = true;

                if (e.key === 'c' || e.key === 'C') setMode('connect');
                if (e.key === 'r' || e.key === 'R') setMode('delete');
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'w' || e.key === 'W') keys.w = false;
                if (e.key === 's' || e.key === 'S') keys.s = false;
                if (e.key === 'a' || e.key === 'A') keys.a = false;
                if (e.key === 'd' || e.key === 'D') keys.d = false;
            });

            // マウスクリックでの設置
            app.view.addEventListener('click', (e) => {
                if (currentMode === 'move') return;

                const worldPos = {
                    x: e.clientX - app.screen.width / 2 + player.x,
                    y: e.clientY - app.screen.height / 2 + player.y
                };

                // リーチ範囲内か確認
                const distToPlayer = Math.hypot(worldPos.x - player.x, worldPos.y - player.y);
                if (distToPlayer > player.reachRadius) return;

                if (currentMode === 'extractor') {
                    // 自然地形の上かチェック
                    const zone = terrainZones.find(z => Math.hypot(z.x - worldPos.x, z.y - worldPos.y) < z.radius);
                    if (zone) {
                        createNode(worldPos.x, worldPos.y, 'extractor', zone.type.elementId);
                        document.getElementById('task-1').classList.add('done');
                        document.getElementById('task-1').innerHTML = '<span>・川/火山に採取陣を配置</span><span>達成！</span>';
                    }
                } else if (currentMode === 'relay') {
                    createNode(worldPos.x, worldPos.y, 'relay', null);
                } else if (currentMode === 'mixer') {
                    createNode(worldPos.x, worldPos.y, 'mixer', null);
                }
            });
        }

        function onNodeClick(e, node) {
            e.stopPropagation();
            const dist = Math.hypot(node.x - player.x, node.y - player.y);
            if (dist > player.reachRadius) return;

            if (currentMode === 'delete') {
                nodes = nodes.filter(n => n !== node);
                lines = lines.filter(l => l.from !== node && l.to !== node);
                nodeContainer.removeChild(node.gfx);
                nodeContainer.removeChild(node.textGfx);
            } else if (currentMode === 'connect') {
                if (!connectingStartNode) {
                    connectingStartNode = node;
                } else {
                    if (connectingStartNode !== node) {
                        lines.push({ from: connectingStartNode, to: node });
                        document.getElementById('task-2').classList.add('done');
                        document.getElementById('task-2').innerHTML = '<span>・導管で中央へエレメント運搬</span><span>達成！</span>';
                    }
                    connectingStartNode = null;
                }
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.hotbar-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${mode}`);
            if (activeBtn) activeBtn.classList.add('active');
            connectingStartNode = null;
        }

        function updateUI() {
            document.getElementById('res-fire').innerText = inventory[1] || 0;
            document.getElementById('res-water').innerText = inventory[2] || 0;
            document.getElementById('res-earth').innerText = inventory[3] || 0;
            document.getElementById('res-wind').innerText = inventory[4] || 0;
        }
    </script>
</body>
</html>
